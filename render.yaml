services:
  - type: web
    name: analisador-cwl-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:api
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: COC_API_TOKEN
        sync: false
      - key: ALLOWED_CLAN_TAG
        sync: false
      - key: APP_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_SECRET
        sync: false
